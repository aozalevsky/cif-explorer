[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "cif-explorer"
dynamic = ["version"]
description = "Browser-based explorer for IHMCIF files: trace rows up and down the category hierarchy, with live dictionary checks and live reload"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Arthur Zalevsky", email = "aozalevsky@gmail.com" }]
keywords = ["mmCIF", "IHMCIF", "PDB-IHM", "integrative structure", "biocuration"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Web Environment",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "ihm>=2.13",
    "numpy>=1.26",
    "msgpack>=1.0.6",
]

[project.urls]
Homepage = "https://github.com/aozalevsky/cif-explorer"
Issues = "https://github.com/aozalevsky/cif-explorer/issues"

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
cif_explorer = "cif_explorer.cli:main"
cif-explorer = "cif_explorer.cli:main"

[tool.hatch.version]
path = "src/cif_explorer/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/cif_explorer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
